[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "cft-revival"
version = "0.1.0"
description = "Modernization foundation for the legacy CFT/HEMP MATLAB model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Angus Muffatti" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["mypy>=1.11", "ruff>=0.6"]
gpu = ["warp-lang>=1.14,<2"]
numerics = ["numpy>=1.24,<3"]
optimization = [
  "torch>=2.0.1,<3",
  "botorch>=0.18.1,<0.19",
  "gpytorch>=1.14.2,<1.15",
  "pymoo>=0.6.1.5,<0.7",
]
all-models = [
  "warp-lang>=1.14,<2",
  "numpy>=1.24,<3",
  "torch>=2.0.1,<3",
  "botorch>=0.18.1,<0.19",
  "gpytorch>=1.14.2,<1.15",
  "pymoo>=0.6.1.5,<0.7",
]

[project.scripts]
cft-revival = "cft_revival.cli:main"

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["src/cft_revival"]

[tool.pytest.ini_options]
# --import-mode=importlib: test modules are imported by path, so the repeated
# basenames across experiment test packages (test_protocol.py, test_results.py,
# test_dashboard.py, ...) no longer collide and one `python -m pytest tests`
# invocation collects everything without renaming files or adding __init__.py.
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cft_revival"]
mypy_path = "src"
