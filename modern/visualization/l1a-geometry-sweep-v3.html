ith the upstream axis interval","rho_wall":"|B|(r_w, z_c) / max |B|(r_w, z) over the two wall cells adjacent to the cusp - the 'cusp is the wall maximum' reading; PPM fundamental-only prediction I_1(x_w) / I_0(x_w) < 1 for every x_w"},"l1b_p2_queue":{"consumer":"a future L1b/P2 confirmation campaign on the HEMP-like representatives of the v3 catalogue","statement":"for every design with r_w / L > 0.5 the TWT/PPM review recommends an L1b (cft_revival.material_fields, screening-only) or P2 (adaptive FEM with iron) confirmation of rho before it is used in a design decision; this campaign records the recommendation and runs no material-aware solve","status":"queued_not_run"},"length_policy":"the pitch and the four radial variables (chamber_outer_radius_m, dielectric_thickness_m, radial_clearance_m, magnet_radial_thickness_m) and the requested exit radius are represented by their nearest multiple of 2^-40 m (0.91 pm) before the sweep-v2 rules are applied, so every radial sum and stage-centre product is exact in binary64 and the geometry v1.1 ULP identities hold with zero error; the sweep-v2 inward-ULP walks are kept as verification and return at their first iteration. Reason (found on the raw Sobol sample before the shakedown): 22 of 128 raw value sets violate (r_w + d) - r_w == d within 2 ULP purely by rounding once r_w + d exceeds 2^-8 m, which no exit-radius walk can repair; requested and represented values are both recorded","manufacturability":{"feasibility_by_construction":"every variable box corner satisfies the geometry v1.1 manufacturing rules (checked in designs.feasibility_report and recorded per design); no design is rejected or resampled","inter_magnet_axial_clearance_m":0.0001,"magnet_material":"cft_revival.magnetics.checked_synthetic_smco_like_magnet: synthetic SmCo-like example, remanence 1.05 T at 293.15 K, recoil mu_r 1.05, intrinsic coercivity 1.6 MA/m; NOT a vendor grade; the L1a source is the two equivalent current sheets (Br / mu0 times the magnet axial thickness) smeared over 0.8 mm, scaled by source_strength_scale in [0.75, 1.3] (harmless for topology and rho, which are scale-invariant)","magnet_to_dielectric_thermal_clearance_m":0.00025,"minimum_manufacturable_thickness_m":0.00025,"pole_pieces":"soft-iron-assumed regions (mu_r 4000) fill the inter-magnet gaps in the geometry but are source-free vacuum in the L1a field (linear vacuum, no material response)","radial_and_axial_tolerance_m":2.5e-05},"ppm_prediction":{"i1_threshold":"I_1(x*) = 1.5 at x* = 1.937318 (r_w / L = 0.616668), computed by bisection on the power series in descriptors.py; the review quotes r_w / L = 0.62 for 1.5x, 0.96 for 4x and 1.30 for 10.6x (I_1 = 4 at x = 3.0130, r_w / L = 0.9591; I_1 = 10.6 at x = 4.0909, r_w / L = 1.3022)","statement":"for an infinite single-harmonic PPM stack of pitch L, wall radius r_w, x_w = pi r_w / L: |B|(r_w, z_c) / b_1 = I_1(x_w); |B|(r_w, z_c) / |B|(r_w, stage centre) = I_1(x_w) / I_0(x_w); review section 2.2","why_i1_not_the_realised_ratio":"the realised rho divides by the finite-stack axis peak (end effects raise the interior peak above the fitted b_1 by a few percent) and the L1a field has small end-effect harmonics, so rho / I_1(x_w) was 0.88-0.94 for the four sweep-v2 representatives and P2 in the review's Table D"},"purpose":"Extend the L1a design space into the HEMP-like regime in which the wall cusp is a genuine field maximum of its cell relative to the adjacent axis peak (Koch design ratio rho >= 1.5), by varying the wall-radius-to-pitch ratio x_w = pi r_w / L (short pitch relative to bore) and the magnet radial thickness / inner radius, with 3-5 full-strength alternating stages. The TWT/PPM review (modern/docs/literature/twt-ppm-physics-for-hemp.md, commit beb4772c, sections 2.2, 4.4, 5.3 and the summary table row 5) established that every recorded field is a single-harmonic PPM field whose wall-cusp |B| is only I_1(x_w) = 0.45-0.61 of the axis peak, so in the sweep-v2 catalogue (x_w = 0.72-1.55) <script>
(function () {
  "use strict";

  const DATA = JSON.parse(document.getElementById("payload").textContent.replace(/<\\\//g, "</"));
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mm = (v, d = 3) => (v === null || v === undefined) ? "-" : (v * 1e3).toFixed(d);
  const num = (v, d = 3) => (v === null || v === undefined) ? "-" : Number(v).toFixed(d);
  const pct = (v) => (v === null || v === undefined) ? "-" : (100 * v).toFixed(1) + " %";
  const STAGE_COLOR = { 3: "var(--s3)", 4: "var(--s4)", 5: "var(--s5)" };
  const svgNs = "http://www.w3.org/2000/svg";
  function el(tag, attrs, text) {
    const node = document.createElementNS(svgNs, tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // ------------------------------------------------------------- header
  $("labels").innerHTML = `<span class="badge">${esc(DATA.classification)}</span><span class="badge">${esc(DATA.topology_label)} (catalogue)</span><span class="badge ok">bundle ${esc(DATA.identity.state)}</span><span class="badge warn">linear-vacuum screening: no plasma / mirror-probability / performance claim</span><span class="badge warn">L1b/P2 confirmation for r_w/L &gt; 0.5: ${esc(DATA.l1b_p2_queue.status)}</span>`;
  $("statement").textContent = DATA.classification_statement;

  // ------------------------------------------------------------- claim boundary
  const cb = DATA.claim_boundary;
  $("claim").innerHTML = `<h2>Claim boundary</h2><div class="box"><ul class="tight">
    <li><b>Field level:</b> ${esc(cb.field_level)}</li>
    <li><b>Definitions:</b> ${esc(cb.definition_source)}</li>
    <li><b>Iron:</b> ${esc(cb.iron_sensitivity)}</li>
    <li><b>L1b/P2:</b> ${esc(cb.l1b_p2_confirmation.statement)}</li>
    <li><b>&rho; and mirror descriptors</b> are field ratios (${cb.mirror_ratios_are_field_descriptors_not_probabilities ? "never probabilities" : "?"}); plasma/performance publication forbidden: ${cb.forbid_plasma_performance_publication}.</li>
    <li><b>Usable as:</b> ${cb.usable_as.map(esc).join("; ")}</li>
  </ul></div><p class="small">${esc(DATA.purpose)}</p>`;

  // ------------------------------------------------------------- headline
  const H = DATA.headline;
  const T = DATA.hypothesis_outcome.test;
  const sob = DATA.estimands.sobol_v3;
  const cf = T.confusion_predicted_i1_vs_realised;

  $("headline").innerHTML = `<h2>Headline (reported, not gated) - ${H.design_count} designs (${H.set_counts.sobol_v3} Sobol + ${H.set_counts.sweep_v2} held-out sweep-v2), all ${Object.keys(DATA.gates.campaign).length} binding integrity gates true</h2>
  <div class="cards">
    <div class="card"><div class="v hemp">${H.sobol_hemp_like_count}/${H.set_counts.sobol_v3}</div><div class="k">Sobol designs HEMP-like (every wall cusp &rho;<sub>cons</sub> &ge; 1.5): ${pct(H.sobol_hemp_like_fraction)}; ${pct(sob.hemp_like_fraction_among_designs_with_cusps)} of designs with a cusp</div></div>
    <div class="card"><div class="v">${H.sobol_predicted_hemp_like_i1_count}</div><div class="k">predicted HEMP-like by I<sub>1</sub>(x_w) &ge; 1.5 (x_w &ge; ${num(T.x_star_prediction, 3)}); realised &amp; predicted ${cf.predicted_and_realised}, predicted only ${cf.predicted_not_realised}, realised only ${cf.not_predicted_but_realised}; accuracy ${pct(T.prediction_accuracy)}</div></div>
    <div class="card"><div class="v">${num(H.sobol_rho_conservative.min, 2)} - ${num(H.sobol_rho_conservative.max, 1)}</div><div class="k">&rho;<sub>cons</sub> range over ${H.sobol_rho_conservative.count} Sobol wall cusps (median ${num(H.sobol_rho_conservative.median, 2)})</div></div>
    <div class="card"><div class="v">${num(T.slope_through_origin, 3)} / ${num(T.r_squared, 2)}</div><div class="k">slope of &rho;<sub>cons</sub> on I<sub>1</sub>(x_w) through the origin / R&sup2;; ${pct(T.fraction_within_band)} of cusps within &plusmn;${pct(T.band)} of I<sub>1</sub></div></div>

  </div>`;

  function scatterPlot(container, opts) {
    const W = 960, Hh = 430, mL = 60, mR = 20, mT = 26, mB = 44;

    const x0 = Math.min(...xs, DATA.v2_x_range[0]) * 0.95, x1 = Math.max(...xs) * 1.03;

  <tr><td>wall-cusp counts</td><td>${esc(Object.entries(R.wall_cusp_counts).map(([a, b]) => `${a}:${b}`).join(", "))}</td></tr>
  <tr><td>min &rho;<sub>cons</sub> per design</td><td>${num(R.min_rho_conservative.min, 2)} - ${num(R.min_rho_conservative.max, 2)}</td></tr>
  </tbody></table><p class="small">Ranges of the ${DATA.estimands.sobol_v3.hemp_like_count} HEMP-like designs; the L1b/P2 confirmation of these designs is ${esc(DATA.l1b_p2_queue.status)}.</p>` : `<p>No HEMP-like design was found.</p>`);

  // ------------------------------------------------------------- design space
  const S = DATA.sampling;
  $("space").innerHTML = `<h2>Design space</h2><p class="small">${esc(S.algorithm)}; ${S.design_count} designs, seed ${S.seed}.</p>
  <table><thead><tr><th>variable</th><th>v3 bounds</th><th>sweep-v2 bounds</th></tr></thead><tbody>
  ${S.variables.map((v) => { const b = S.sweep_v2_box[v.name]; return `<tr><td>${esc(v.name)}</td><td>${v.lower} - ${v.upper} ${esc(v.units)}</td><td>${b ? `${b[0]} - ${b[1]}` : "same"}</td></tr>`; }).join("")}
  </tbody></table>
  <p class="small">${esc(S.regime_coverage.hemp_like_predicted_where)}. ${esc(S.regime_coverage.why_not_shorter_pitch)}. ${esc(S.bounds_provenance)}.</p>
  <p class="small"><b>Manufacturability assumed:</b> ${esc(DATA.manufacturability.magnet_material)}; minimum thickness ${DATA.manufacturability.minimum_manufacturable_thickness_m * 1e3} mm, tolerances ${DATA.manufacturability.radial_and_axial_tolerance_m * 1e6} um, thermal clearance ${DATA.manufacturability.magnet_to_dielectric_thermal_clearance_m * 1e3} mm. ${esc(DATA.manufacturability.pole_pieces)}.</p>`;

  // ------------------------------------------------------------- held-out
  const HD = DATA.held_out;
  $("heldout").innerHTML = `<h2>Held-out reproduction of sweep v2 (binding)</h2><table><tbody>
  <tr><td>designs rebuilt with sealed hashes and re-solved</td><td>${HD.design_count}</td></tr>
  <tr><td>QoIs replayed within the sweep-v2 tolerances</td><td>${HD.qoi_replay_passed_count}/${HD.design_count}</td></tr>
  <tr><td>stored representative maps reproduced node-wise</td><td>${HD.stored_representatives_checked}</td></tr>
  <tr><td>sealed axis nulls in bijection with v3 nulls</td><td>${HD.axis_null_bijection_count}/${HD.design_count} (${HD.reference_null_count} nulls, max difference ${mm(HD.max_axis_null_difference_m, 4)} mm)</td></tr>
  </tbody></table>
  <h3>Sweep-v2 metric gates verbatim (all 224 designs)</h3><table><thead><tr><th>gate</th><th>comparator / limit</th><th>observed extreme</th><th>passed</th></tr></thead><tbody>
  ${Object.entries(DATA.gates.sweep_v2_gate_breakdown).map(([k, g]) => `<tr><td>${esc(k)}</td><td>${esc(g.comparator)} ${g.limit}</td><td>${typeof g.observed_extreme === "number" ? g.observed_extreme.toExponential(3) : esc(String(g.observed_extreme))}</td><td><span class="badge ${g.passed ? "ok" : "bad"}">${g.passed}</span></td></tr>`).join("")}
  </tbody></table><p class="small">${esc(Object.entries(DATA.gates.not_applicable).map(([k, v]) => `${k}: ${v}`).join("; "))}.</p>`;

  // ------------------------------------------------------------- design table
  const rows = DATA.designs.map((d) => `<tr><td>${esc(d.set)}</td><td>${esc(d.id)}</td><td>${d.stages}</td><td>${mm(d.rw_m, 2)}</td><td>${mm(d.pitch_m, 2)}</td><td>${num(d.x_w, 2)}</td><td>${num(d.i1, 2)}</td><td>${d.in_v2_box ? "yes" : ""}</td><td>${d.nulls}</td><td><b>${d.cusps}</b></td><td>${d.rho.map((r) => num(r, 2)).join(", ")}</td><td>${d.hemp ? '<span class="hemp">yes</span>' : "no"}</td><td>${num(d.b3_b1, 3)}</td><td>${num(d.angle_max, 1)}</td><td>${mm(d.shift_m, 4)}</td><td>${pct(d.rho_sens)}</td><td>${d.boundary.toExponential(2)}</td></tr>`).join("");
  $("designs").innerHTML = `<h2>All ${DATA.designs.length} designs</h2><div class="scroll"><table><thead><tr><th>set</th><th>design</th><th>N</th><th>r_w (mm)</th><th>L (mm)</th><th>x_w</th><th>I_1</th><th>v2 box</th><th>nulls</th><th>cusps</th><th>&rho;<sub>cons</sub> per cusp</th><th>HEMP-like</th><th>|b3/b1| wall</th><th>max angle (&deg;)</th><th>max shift (mm)</th><th>&rho; sens.</th><th>boundary ratio</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  // ------------------------------------------------------------- gates
  const G = DATA.gates;
  $("gates").innerHTML = `<h2>Binding integrity gates (all true) and replay</h2><table><thead><tr><th>gate</th><th>value</th><th>definition</th></tr></thead><tbody>
  ${Object.keys(G.campaign).map((k) => `<tr><td>${esc(k)}</td><td><span class="badge ${G.campaign[k] ? "ok" : "bad"}">${G.campaign[k]}</span></td><td class="small">${esc(G.definitions[k] || "")}</td></tr>`).join("")}
  </tbody></table><p class="small">Reported, not binding: ${G.reported_not_binding.map(esc).join("; ")}. Replays (main-process re-solve + re-characterization vs worker payload): ${G.replays.map((r) => `${esc(r.key)} bit-identical=${r.bit_identical}`).join("; ")}. Execution: ${DATA.execution.worker_pool_size} CPU workers, design stage ${num(DATA.execution.stage_wall_s, 0)} s, assessment ${num(DATA.execution.assessment_wall_s, 0)} s.</p>`;

  // ------------------------------------------------------------- identity
  const I = DATA.identity;
  $("identity").innerHTML = `<h2>Provenance</h2><ul class="tight small">
  <li>experiment <code>${esc(I.experiment_id)}</code>, preregistration commit <code>${esc(I.preregistration_commit_sha)}</code>, command <code>${esc(I.execution_command)}</code>, device <code>${esc(I.device)}</code></li>
  <li>manifest <code>${esc(I.manifest_file_sha256)}</code> (${I.verified_file_count} files byte-verified of ${I.artifact_count} artifacts); terminal <code>${esc(I.terminal_file_sha256)}</code>; lock <code>${esc(I.lock_file_sha256)}</code></li>
  <li>protocol semantic <code>${esc(I.protocol_semantic_sha256)}</code>; protocol file (LF) <code>${esc(I.protocol_file_sha256_lf)}</code></li>
  <li>experiment code <code>${esc(I.experiment_code_sha256)}</code>; dependency sources <code>${esc(I.dependency_source_sha256)}</code>; field pipeline <code>${esc(I.field_pipeline_source_sha256)}</code></li>
  <li>sealed sweep-v2 source: manifest <code>${esc(I.sealed_sources.sweep_v2.manifest_file_sha256)}</code>, preregistration <code>${esc(I.sealed_sources.sweep_v2.preregistration_commit)}</code></li>
  <li>catalogue <code>${esc(DATA.catalogue.schema_version)}</code> at <code>${esc(DATA.catalogue.path)}</code>: ${DATA.catalogue.design_count} entries, ${DATA.catalogue.stable_design_count} stable, ${DATA.catalogue.hemp_like_design_count} HEMP-like - ${esc(DATA.catalogue.consumer_contract)}</li>
  <li>generator <code>${esc(I.generator_sha256)}</code>; template <code>${esc(I.template_sha256)}</code></li>
  </ul>`;
})();
</script>
