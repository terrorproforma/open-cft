<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDO L0 campaign v2 — the corrected L0 model over the screened design catalogue</title>
<style>
:root{--bg:#0f1419;--panel:#171d25;--ink:#e7ecf2;--muted:#9aa7b5;--line:#2a3441;--bo:#4fc3f7;--nsga:#ffb74d;--lhs:#a5d6a7;--warn:#ff7043;--ok:#66bb6a;--nom:#ce93d8;--v1:#b0bec5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;overflow-wrap:anywhere}
p,li,td,code,.mono{overflow-wrap:anywhere;word-break:break-word}
header{padding:20px 24px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 6px}
h2{font-size:16px;margin:0 0 10px;color:var(--ink)}
h3{font-size:14px;margin:12px 0 6px;color:var(--muted)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:16px 24px 40px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
section.wide{grid-column:1/-1}
.claim{border-color:var(--warn)}
.claim p{margin:6px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600;margin-right:6px}
.ok{background:#1b3a25;color:var(--ok)}.fail{background:#4a1f16;color:var(--warn)}.info{background:#1f2a3a;color:var(--bo)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--muted);font-weight:600}
svg{width:100%;height:auto;display:block}
.legend span{display:inline-block;margin-right:12px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
ul{margin:6px 0;padding-left:18px}
.scroll{overflow-x:auto}
footer{padding:12px 24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media (max-width:600px){main{padding:10px}header{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>MDO L0 campaign v2 — the corrected L0 model over the screened design catalogue</h1>
  <div id="headline" class="muted"></div>
</header>
<main>
  <section class="claim wide" id="claim"></section>
  <section class="wide" id="v1v2"></section>
  <section class="wide" id="hv"></section>
  <section id="hvtable"></section>
  <section id="gates"></section>
  <section class="wide" id="catalogue"></section>
  <section class="wide" id="fronts"></section>
  <section class="wide" id="closures"></section>
  <section class="wide" id="widths"></section>
  <section id="timing"></section>
  <section id="protocol"></section>
  <section id="provenance"></section>
</main>
<footer id="footer"></footer>
<div id="jserrors" hidden></div>
<script>
window.addEventListener("error", function(event){
  var sink = document.getElementById("jserrors");
  if (sink) { sink.textContent += (event.message || "error") + "\n"; }
});
</script>

per_gate":"GATE-FOUR-CELL-CLOSURE-V1 (d09ffee2)"},"l0_model":{"accepted_evidence":"modern/docs/FIRST_RESULTS.md (8,192-point CPU/CUDA parity sweep, config/l0-deterministic-sweep.json)","backend_used_here":"python-reference (cft_revival.physics.reference.evaluate_performance, CPU, no Warp)","fidelity":"L0-conservation-reduced-performance","package":"cft_revival.physics"},"rejected_surrogates":[{"experiment":"modern/experiments/wall_loss_geometry_surrogate_v1","outcome":"rejected_surrogate","result_commit":"b400d924"},{"experiment":"modern/experiments/wall_loss_geometry_surrogate_v2","outcome":"rejected_surrogate","result_commit":"a2b503be"}],"screening_dataset":{"classification":"SCREENING_L1A_FIELD_TEST_PARTICLE_WALL_LOSS","experiment":"modern/experiments/orbit_wall_loss_geometry_screening_v1","launches":"512 per design at the accepted-2N timestep (converged N -> 2N); four axial launch cells of 128 launches each","merge_commit":"22e2156b","paper_gate":"GATE-WALL-LOSS-GEOMETRY-SCREENING-V1 (3003325d, recorded outcome accepted-screening-dataset)","preregistration_commit":"c86bfca3","result_commit":"ab7c2897"},"v1_campaign":{"dashboard_commit":"e642f38c","experiment":"modern/experiments/mdo_l0_campaign_v1","paper_gate":"GATE-MDO-L0-V1 (ba6875f6)","posthoc_audit_commit":"e9f9af16","posthoc_audit_verdict":"ACCEPTED WITH DISCLOSURES (F9, F10, F22, F26, F27, F28)","preregistration_commit":"4898d0fd","result_commit":"c553124b"}},"budget":{"evaluations_per_run":160,"fairness":["same initial observations per seed across strategies (the 32-row LHS of the seed, mapped identically to catalogue index + operating point)","same evaluation budget","same constraint and failure policy","same reference point and normalization"],"initial_design":32,"nsga3_generations":5,"nsga3_population_size":32,"qlognehvi_batch_size":8,"qlognehvi_iterations":16,"seeds":[101,202,303],"sizing":"v1 used 96 evaluations for three continuous variables; the catalogue adds a 96-level categorical, so the budget is raised to 160 = 32 + 128: the shared initial design covers one third of the catalogue (32 distinct designs) and the total is 1.67 evaluations per catalogue member, enough for an optimiser to revisit every promising design while the whole execution stays inside ~1.5 h of CPU: one design evaluation (64 + 1 L0 points) takes ~5 ms; qLogNEHVI's cost is dominated by the hypervolume partitioning (~60 s per 8-point batch under contention, 16 batches x 3 seeds ~ 50 min); NSGA-III and LHS take seconds; the parallel dense reference ~2-5 min","strategies":["qlognehvi","nsga3","lhs"],"total_evaluations":1440},"claim_boundary":{"closure_identification":"CL-1 identifies the collisionless test-particle wall-hit probability of a launch cell (an orbit_mc screening estimand on an L1a field, no electric field, no collisions, no sheath) with the closure's per-cusp survival factor (1 - p_k). The v1 scenario analysis (v1 protocol scenario v4_per_cell_jeffreys; paper claim CLM-033) showed that this quantity is NOT the Kornfeld per-cusp probability of a sustained discharge: feeding the v4 per-cell wall-hit estimates into CL-1 gives a beam of ~1e-7 of the produced ions. Every number produced here is therefore conditional on this identification. A design that 'wins' here wins UNDER THIS DECLARED CLOSURE ONLY; it is not shown to be a better thruster.","forbidden_readings":["any statement that a design 'performs' in thrust, Isp or efficiency","any statement about a physical thruster, the DM9.2 device, or Yeo 2020","any statement that a catalogue design is a better thruster than another (it is better under CL-1 on the L0 model only)","any statement that BoTorch, NSGA-III or LHS is 'better' beyond the recorded budget, seeds and model","any use of these fronts as calibration, validation or design recommendation","any reading of the screening P(wall) as a plasma cusp-loss probability"],"relation_to_v1":"v1 (mdo_l0_campaign_v1, accepted c553124b, audited e9f9af16 ACCEPTED WITH DISCLOSURES) optimised the operating point only, with independent U[0, 0.45] cusp probabilities as a wide prior. v2 keeps v1's L0 chain, objectives, comparison scales, reference point, CVaR(0.25) robust formulation, worst-sampled-case constraint and the identical 64 radical-inverse unit rows, so hypervolumes are comparable; only the design identity (catalogue index + operating point), the source of the cusp probabilities (screening counts, per design) and the optimiser adaptations to the mixed space differ.","statement":"This campaign optimises the corrected L0 conservation model (cft_revival.physics, L0-conservation-reduced-performance) over a DISCRETE CATALOGUE of 96 screened designs times a continuous operating point, with each design's per-cell wall-loss probabilities taken DIRECTLY from the accepted screening dataset of orbit_wall_loss_geometry_screening_v1 (classification SCREENING_L1A_FIELD_TEST_PARTICLE_WALL_LOSS) through a DECLARED closure. It makes no thruster-performance claim, no plasma claim, and no claim about any physical cusped-field thruster. Its estimands are properties of the optimisers on this mixed design space (hypervolume attained per evaluation budget, Pareto-set size, seed variance, constraint handling, which catalogue designs the optimisers select) and of the declared evaluation chain (robust-vs-nominal fronts, CL-1 vs CL-2 fronts, sensitivity to the binomial uncertainty width of the screening counts).","why_no_surrogate":"Two surrogates over the screening dataset were REJECTED on predeclared gates (wall_loss_geometry_surrogate_v1, result b400d924, rejected_surrogate; wall_loss_geometry_surrogate_v2, result a2b503be, rejected_surrogate). No surrogate may be used; the geometry enters only through the 96 screened designs themselves (a categorical design index with their sealed geometry and counts), so no interpolation between designs is claimed or performed.","why_the_catalogue_is_the_design_space":"v1 excluded geometry because no geometry-to-L0 map existed. The screening dataset supplies, for exactly 96 designs, a measured per-cell P(wall) with binomial uncertainty; the campaign's design space is therefore this discrete catalogue (no continuous geometry variables), and the geometry -> performance link reported here is the link under CL-1 between a design's screening P(wall) and its position on the recorded fronts."},"classification":"l0_model_optimisation_over_screened_design_catalogue_with_test_particle_wall_loss_closure_not_thruster_performance","closures":{"CL-1":{"id":"CL-1-multiplicative-cusp-survival-per-cell-test-particle-wall-loss","identification_disclosure":"declares the identification of a collisionless test-particle wall-hit probability (orbit_mc screening estimand) with the closure's per-cusp survival factor; the v1 scenario analysis showed this quantity is not the Kornfeld per-cusp probability of a sustained discharge, so every result is conditional on this declared identification","relation_to_corrected_model":"applies the corrected cusp-current relation jic[k] = p[k] * je[k-1] (dielectric neutrality) of cft_revival.plasma as a multiplicative cascade over the four launch cells; the corrected four-cell solver itself has no root for interior p (global-plasma-closure-analysis.md, 266d8a99) and is not used","role":"campaign","statement":"S(p) = prod_{k=1..4} (1 - p_k) with p_k := P(wall | launch cell k, design) from the screening counts. The exhaust ionised number fraction is eta_m = eta_ion * S(p); the complement recombines at the dielectric wall and leaves as neutrals. The anode current is unaffected (the wall current is a closed electron-ion loop outside the anode circuit).","status":"declared assumption; not derived; not validated"},"CL-2":{"id":"CL-2-pooled-test-particle-wall-loss-survival","role":"sensitivity","statement":"S = 1 - p_pooled with p_pooled := P(wall | design) pooled over all 512 launches of the accepted-2N case (Jeffreys Beta posterior of the pooled counts)","status":"declared sensitivity closure; not derived; not validated","use":"every recorded design is re-evaluated under CL-2 with the campaign posterior width; the CL-2 robust nondominated set and its overlap with the CL-1 set are reported, not gated"},"fixed":{"cathode_input_power_w":15.0,"note":"PPU efficiency only constructs an admissible PPU boundary; no PPU objective is used (v1)","ppu_efficiency_fraction":0.9}},"constraints":[{"definition":"Ia - max over the design's frozen 64 draws of beam_current_a(mdot, theta); a negative margin violates the L0 domain (beam current <= anode current) for at least one draw; the design then has NO robust objectives (fail-closed, failure code beam_current_exceeds_anode_current) and never enters a front or hypervolume","name":"robust_beam_current_margin_a","role":"optimised (worst-sampled-case robust constraint)","sense":">=","threshold":0.0,"units":"A","violation_scale":0.1},{"definition":"Ia - beam_current_a(mdot, nominal theta of the design)","name":"nominal_beam_current_margin_a","role":"analysis only (nominal front)","sense":">=","threshold":0.0,"units":"A","violation_scale":0.1}],"dense_reference":{"cost_note":"96 x 8192 = 786,432 design evaluations (~51 million L0 points) would take ~70 min sequentially; 96 x 1024 = 98,304 (~6.4 million L0 points, ~10 min sequential, ~1-3 min on 12 workers) is declared instead","designs":96,"max_workers":12,"method":"every catalogue design x one fixed 1024-point operating-point grid (cft_revival.optimization.sampling.initial_designs, shifted Halton with boundary challenges; v1's construction with 1024 instead of 8192 points)","parallelism_note":"evaluated in parallel by design with concurrent.futures.ProcessPoolExecutor (<= 12 workers); every worker evaluates a pure deterministic function of (design, grid), so the result is independent of the worker count and replays bit-exactly","points_per_design":1024,"purpose":"reference robust and nominal fronts and hypervolumes for the attained-fraction metric, and the exhaustive picture of which catalogue designs can appear on a front under CL-1; NOT an optimiser run and not part of the benchmark","seed":20260903,"storage":"the full columnar record is hashed (columns_sha256) and its fronts, per-design summaries and grid are sealed; the 98,304 rows themselves are not stored (~40 MB) and are recomputed by the audit replay","total_evaluations":98304},"design_space":{"catalogue":{"index_rule":"catalogue index k = sweep_index = position in geometry-wall-loss-dataset.json#designs (0..95); case ids l1a-gs-v2-000.. -095","kind":"categorical","name":"catalogue_index","size":96,"source_classification":"SCREENING_L1A_FIELD_TEST_PARTICLE_WALL_LOSS","statement":"each catalogue member is one accepted sweep-v2 design with its sealed geometry (geometry_sha256) and its accepted-2N wall-hit counts; the optimisers choose a member, never a geometry value","unit_coordinate_rule":"for LHS/shared initial designs a unit coordinate u maps to k = min(95, floor(96 u))"},"operating_point":[{"bound_rule":"v1's accepted L0 domain (config/l0-deterministic-sweep.json)","legacy":"anode_voltage_v (Ua)","lower":150.0,"name":"discharge_voltage_v","units":"V","upper":500.0},{"bound_rule":"v1's accepted L0 domain","legacy":"anode_current_a (Ia)","lower":0.1,"name":"anode_current_a","units":"A","upper":2.5},{"bound_rule":"v1's accepted L0 domain","legacy":"mass_flow_sccm (mdot)","lower":2e-07,"name":"propellant_mass_flow_kg_per_s","units":"kg/s","upper":2e-06}]},"gates":{"binding":{"budget_exact":"every run recorded exactly evaluations_per_run evaluations","catalogue_binding":"the screening dataset and manifest on disk hash to the declared bytes, match their Git blobs at the screening result commit, the manifest entry carries the same byte hash, and the result commit is an ancestor of HEAD","code_contract":"package source hash, package versions and protocol hash equal the preregistered authorities","code_hash_scope_matches_imports":"at the end of the assessment the set of repository files (cft_revival/** and the experiment package) present in sys.modules equals code_contract.source_hash_scope exactly (nothing bound that was never imported, nothing imported that is unbound; v1 audit F10)","hypervolume_monotone":"every recorded hypervolume curve is non-decreasing in evaluations up to floating-point roundoff (relative decrease <= 1e-12; the exact slicing hypervolume of a growing set is monotone in exact arithmetic, but a new point with a negligible exclusive contribution changes the slicing order and moved the result by -2.1e-16 relative in the shakedown); the largest recorded decrease is written to the gate record","l0_domain":"every successful evaluation has non-negative robust margin and all objectives finite; every infeasible evaluation has negative robust margin, code beam_current_exceeds_anode_current and no robust objectives","labels_consistent":"every qLogNEHVI run's optimizer.acquisition equals the label rebuilt from its recorded arguments and its optimizer.model names MixedSingleTaskGP, CategoricalKernel, MaternKernel and Standardize; every NSGA-III run records declared_generations == generations, pymoo_n_gen separately, pymoo_reported_evaluations == evaluations_per_run and eliminate_duplicates == true; every LHS run records its two stage sizes (v1 audit F28)","nsga3_duplicates_eliminated":"every NSGA-III run evaluated evaluations_per_run DISTINCT designs (v1 audit F27)","pareto_replay":"every design in every final Pareto set replays bit-exactly and is nondominated among its run's successful evaluations","replay_bit_exact":"every recorded evaluation (design identity, margins, robust statistics, nominal objectives, survival statistics, sample result hash) is recomputed through model.evaluate_design on CPU and compared bit-exactly","sample_hash":"the frozen unit rows and the per-design catalogue sample recompute to uncertain_inputs.sample.unit_rows_sha256 / catalogue_sample_sha256","shared_initial_design":"for each seed the first initial_design (catalogue index, operating point) pairs are identical across the three strategies"},"reported_not_binding":{"bo_beats_nsga3":"final robust hypervolume of qlognehvi > nsga3 for >= 2 of 3 seeds (paired by seed); reported as a count of seeds","bo_beats_random":"final robust hypervolume of qlognehvi > lhs for >= 2 of 3 seeds (paired by seed); reported as a count of seeds","closure_cl1_vs_cl2":"the pooled designs re-evaluated under CL-2: front size, shared designs and Jaccard with the CL-1 front, hypervolume, catalogue members","hypervolume_vs_dense_reference":"final robust hypervolume of every run divided by the dense-reference robust hypervolume","per_design_separability":"relative spread of the robust/nominal objective ratio within every design <= 1e-9","robust_front_catalogue_designs":"the catalogue designs on the pooled robust front with their sealed geometry and screening P(wall) (the geometry -> performance link under CL-1)","robust_vs_nominal":"differences between the robust and nominal fronts of the pooled designs, including which catalogue designs each contains","uncertainty_width_sensitivity":"the pooled designs re-evaluated under the rescaled posterior widths and the point estimate: front size, Jaccard with the campaign front, hypervolume, agreement on the common feasible set up to roundoff ties (relative tolerance 1e-9)"},"semantics":"Every binding gate is a recording-INTEGRITY gate: it tests that the declared pipeline ran once and recorded consistently (replay, fail-closed domain rule, budgets, shared initial designs, frozen sample and catalogue hashes, Pareto replay, code contract, import scope, duplicate elimination, label consistency). accepted_result therefore means 'recorded consistently', NOT that any optimiser is effective or that any design is good (v1 audit F26). Every efficacy statement is reported_not_binding and carries its seed count; three seeds support counts, never significance.","terminal_rule":"accepted_result iff every binding gate passes; the reported tests are recorded pass/fail and never change the terminal state"},"objectives":[{"comparison_scale":0.06,"definition":"IdealPerformanceResult.axial_thrust_n = gamma * mdot * (xe_plus * v_plus + xe_double_plus * v_double_plus), v_z = sqrt(2 z e Ua / m_Xe)","direction":"maximize","name":"axial_thrust_n","units":"N"},{"comparison_scale":3000.0,"definition":"IdealPerformanceResult.specific_impulse_s = gamma * (xe_plus * v_plus + xe_double_plus * v_double_plus) / g0","direction":"maximize","name":"specific_impulse_s","units":"s"},{"comparison_scale":1.0,"definition":"ReportedPowerBudget.thruster_electrical_to_beam_efficiency = Ua * I_beam / (Ua * Ia + P_cathode); L0's ledgered thruster-boundary efficiency, NOT the legacy total_efficiency (AUDIT.md S3)","direction":"maximize","name":"thruster_electrical_to_beam_efficiency","units":"1"},{"comparison_scale":1300.0,"definition":"ReportedPowerBudget.anode_input_power_w = Ua * Ia","direction":"minimize","name":"anode_input_power_w","units":"W"}],"optimizers":{"lhs":{"design":"two-stage Latin hypercube in the 4-dimensional unit cube: stage 1 = the shared 32-point LHS of the seed, stage 2 = one 128-point LHS from the continuation of the same seeded stream; the first coordinate maps to the catalogue index (32 strata over 96 designs, so the shared initial design covers 32 distinct designs), the other three to the operating point","library":"python stdlib random.Random (Mersenne Twister), numpy","note":"dependency-free by design so the baseline and the shared initial design replay on any interpreter","seed_policy":"random.Random(seed); the first 32 rows are the shared initial design of the seed"},"nsga3":{"algorithm":"NSGA3","constraint_handling":"pymoo feasibility-first with G = -margin/0.1 <= 0","eliminate_duplicates":true,"eliminate_duplicates_implementation":"MixedVariableDuplicateElimination on the population and inside mating (v1 audit F27); the binding gate nsga3_duplicates_eliminated requires every NSGA-III evaluation to be a distinct design","generation_count_policy":"declared_generations (5) and pymoo's post-incremented counter pymoo_n_gen (6) are recorded as separate fields (v1 audit F28)","generations":5,"infeasible_placeholder":"objective placeholder = reference point (zero attained hypervolume) for pymoo's internal ranking only; never recorded as an observation, never in any front or hypervolume","initial_population":"the shared 32-row LHS of the seed mapped to mixed-variable individuals","library":"pymoo","population_size":32,"reference_direction_seed":1,"reference_directions":"energy, 4 objectives, 32 points, seed 1","sampling_and_mating":"Population of the shared initial design; MixedVariableMating(eliminate_duplicates=MixedVariableDuplicateElimination())","seed_policy":"pymoo minimize(seed=seed)","variables":"catalogue_index Choice(options=range(96)); discharge_voltage_v, anode_current_a, propellant_mass_flow_kg_per_s Real(bounds=(0, 1)) in the unit cube"},"qlognehvi":{"acquisition":"qLogNoisyExpectedHypervolumeImprovement via cft_revival.optimization.botorch_adapter.build_qlognehvi (prune_baseline, cache_pending, strict-negative constraint callable, IdentityMCMultiOutputObjective on the objective indices)","batch_size":8,"candidate_stage":"optimize_acqf_discrete over a candidate set = every catalogue design x candidates_per_design LHS operating points (stdlib random.Random(seed*1000 + iteration), fresh each iteration), q chosen sequentially greedy with unique=True, max_batch_size 1024","candidates_per_design":8,"device":"cpu","device_note":"cpu declared (v1 measured GP fits and acquisition 20-40x slower on the PIC-occupied cuda:0); torch.set_num_threads(12) is part of the contract because the recorded numbers are replayed bit-exactly only with the same thread count (v1 audit); a CUDA float64 probe is still recorded in the development stage","dtype":"float64","fit_noise_floor":1e-06,"label_policy":"optimizer.acquisition and optimizer.model in every run artifact are generated from the arguments actually passed / the fitted objects and are re-derived by the binding gate labels_consistent (v1 audit F28)","library":"botorch","mc_samples":32,"model":"ModelListGP of five MixedSingleTaskGP models (one per objective fitted on feasible observations, one for the constraint on all observations); inputs [catalogue index (categorical, cat_dims=[0], CategoricalKernel), u_Ua, u_Ia, u_mdot (unit cube, Matern-5/2 ARD via get_covar_module_with_dim_scaled_prior(use_rbf_kernel=False))]; BoTorch's mixed kernel = ScaleKernel(cont + ScaleKernel(cat)) + ScaleKernel(cont * cat); Standardize outcome transform; Gaussian likelihood with noise floor fit_noise_floor; the recorded model label is read from the fitted objects' class names","objective_transform":"cft_revival.optimization.botorch_adapter.transform_model_output_values: physical objectives divided by comparison_scale then sign-transformed to all-maximise; constraint (0 - margin)/0.1 - 1e-12","reference_point_transform":"same transform applied to the declared reference point","refine_maxiter":30,"refinement_stage":"for each of the q members in order: optimize_acqf (L-BFGS-B, num_restarts 1, batch_initial_conditions = the member, fixed_features = its catalogue index, every other member pending, maxiter refine_maxiter); the refined operating point replaces the member iff its acquisition value (with the same pending set) is not lower than the member's; both values are recorded","sampler":"SobolQMCNormalSampler(seed = seed*1000 + iteration)","seed_policy":"torch.manual_seed(seed); candidate values are recorded so the L0 replay does not depend on floating-point reproducibility of the acquisition optimiser","torch_threads":12,"why_this_optimiser":"the catalogue index has no neighbourhood structure, so the categorical dimension is enumerated exhaustively at every iteration instead of being explored by local moves (optimize_acqf_mixed_alternating), and the continuous coordinates are then refined by gradient ascent; measured on 2026-09-03 under CPU contention: ~40-50 s candidate stage + ~15 s refinement per 8-point batch versus ~100 s for optimize_acqf_mixed_alternating at reduced settings"}},"reference_point":{"anode_input_power_w":1300.0,"axial_thrust_n":0.0,"normalization":"v1's: maximise objectives (value - reference) / comparison_scale; minimise (reference - value) / comparison_scale; hypervolume in this dimensionless all-maximise frame against the origin with the exact recursive slicing algorithm (model.hypervolume); identical units and scales to v1 so hypervolumes are comparable","specific_impulse_s":0.0,"thruster_electrical_to_beam_efficiency":0.0},"robust_formulation":{"definition":"for each objective the mean of the 16 worst of the design's 64 sample values (lower tail for maximise, upper tail for minimise); the optimisers see exactly these four robust objectives and the robust constraint","nominal_front":"the nondominated set of the SAME evaluated designs under each design's nominal theta and the nominal constraint (re-evaluation, not a separate optimisation)","predeclared_expectation":"Under CL-1 every objective is separable, f_j(k, x, theta) = g_j(x) * h_j(k, theta) with g_j > 0 (anode power has h = 1), so WITHIN one catalogue design the ratio CVaR/nominal of each objective is constant over operating points (relative spread <= 1e-9, reported per design); ACROSS designs it varies with the design's own posterior. The catalogue therefore enters the fronts through a per-design multiplier on thrust, Isp and efficiency and through the feasible set (the worst sampled beam current). Reported, not tuned.","risk_measure":"CVaR","tail_count":16,"tail_fraction":0.25},"uncertain_inputs":{"nominal":"per design the Jeffreys posterior mean (s + 1/2)/(n + 1) of every count at full double precision; shared inputs at their prior midpoints (eta = 0.815, zeta = 0.075, gamma = 0.865)","per_design_inputs":[{"distribution":"jeffreys-beta-posterior","meaning":"P(wall | launch cell 1, design) of the screening dataset, identified with the CL-1 per-cusp loss probability p_1 (see claim_boundary.closure_identification)","name":"wall_loss_probability_cell_1","parameters":"Beta(s_k + 1/2, n_k - s_k + 1/2) with s_k the design's accepted-2N wall_hit successes in cell k and n_k = 128","trials":128,"units":"1"},{"distribution":"jeffreys-beta-posterior","meaning":"P(wall | launch cell 2, design) of the screening dataset, identified with the CL-1 per-cusp loss probability p_2 (see claim_boundary.closure_identification)","name":"wall_loss_probability_cell_2","parameters":"Beta(s_k + 1/2, n_k - s_k + 1/2) with s_k the design's accepted-2N wall_hit successes in cell k and n_k = 128","trials":128,"units":"1"},{"distribution":"jeffreys-beta-posterior","meaning":"P(wall | launch cell 3, design) of the screening dataset, identified with the CL-1 per-cusp loss probability p_3 (see claim_boundary.closure_identification)","name":"wall_loss_probability_cell_3","parameters":"Beta(s_k + 1/2, n_k - s_k + 1/2) with s_k the design's accepted-2N wall_hit successes in cell k and n_k = 128","trials":128,"units":"1"},{"distribution":"jeffreys-beta-posterior","meaning":"P(wall | launch cell 4, design) of the screening dataset, identified with the CL-1 per-cusp loss probability p_4 (see claim_boundary.closure_identification)","name":"wall_loss_probability_cell_4","parameters":"Beta(s_k + 1/2, n_k - s_k + 1/2) with s_k the design's accepted-2N wall_hit successes in cell k and n_k = 128","trials":128,"units":"1"}],"pooled_input":{"distribution":"jeffreys-beta-posterior","name":"wall_loss_probability_pooled","parameters":"Beta(s + 1/2, n - s + 1/2) with s the design's accepted-2N pooled wall_hit successes and n = 512","quantile_coordinate":"the first radical-inverse coordinate (base 2), shared with p_1","trials":512,"units":"1","used_by":"CL-2-pooled-test-particle-wall-loss-survival"},"sample":{"bases":[2,3,5,7,11,13,17],"catalogue_sample_sha256":"ede6f281f   const ys = {min: 0, max: extent(allAcq).max * 1.1}, xs = {min: 1, max: Math.max(...bo.map(l => l.length))};
  let s = svgOpen(W, H) + axis(x0, y0, x1, y0) + axis(x0, y0, x0, y1) + ticks(xs, Math.min(8, xs.max-1), true, x0, y0, x1, y1, t => t.toFixed(0)) + ticks(ys, 4, false, x0, y0, x1, y1, t => t.toFixed(0));
  bo.forEach((l, i) => { s += `<polyline points="${l.map(e => `${lin(e.iteration, xs, x0, x1).toFixed(1)},${lin(e.candidate_stage_seconds + e.refinement_seconds, ys, y0, y1).toFixed(1)}`).join(" ")}" fill="none" stroke="#4fc3f7" stroke-width="1.4" opacity="${0.5 + 0.25*i}"/>`; });
  s += `<text x="${(x0+x1)/2}" y="${H-2}" fill="#9aa7b5" font-size="10" text-anchor="middle">BO iteration (batch of ${P.plan.qlognehvi_batch_size})</text><text transform="translate(12,${(y0+y1)/2}) rotate(-90)" fill="#9aa7b5" font-size="10" text-anchor="middle">candidate + refinement seconds</text></svg>`;
  const accepted = bo.map(l => l.reduce((a, e) => a + e.refinements_accepted, 0));
  el("timing").innerHTML = `<h2>Timing</h2><div class="scroll"><table><thead><tr><th>strategy</th><th>seed</th><th>wall [s]</th><th>L0 eval [s]</th><th>GP fit [s]</th><th>acquisition [s]</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h3>qLogNEHVI acquisition seconds per iteration (three seeds)</h3>${s}
  <p class="muted">Continuous refinements accepted per seed: ${accepted.join(" / ")} of ${P.plan.qlognehvi_iterations * P.plan.qlognehvi_batch_size}. Assessment ${fmt(P.campaign_result.assessment_seconds,4)} s. Device: ${esc(P.protocol.optimizers.qlognehvi.device)}, torch threads ${P.runs["qlognehvi:"+P.seeds[0]].labels.torch_threads}.</p>`;
}

  <p class="muted">Nominal: ${esc(pr.uncertain_inputs.nominal)}</p>

  <h3>Objectives</h3><ul>${pr.objectives.map(o => `<li><code>${esc(o.name)}</code> ${esc(o.direction)} [${esc(o.units)}], scale ${o.comparison_scale}</li>`).join("")}</ul>
  <h3>Constraint</h3><ul>${pr.constraints.map(c => `<li><code>${esc(c.name)}</code> ${esc(c.sense)} ${c.threshold} ${esc(c.units)} (${esc(c.role)})</li>`).join("")}</ul>
  <h3>Robust formulation</h3><p class="muted">${esc(pr.robust_formulation.definition)}</p>
  <h3>Optimisers and budget</h3><ul>
  <li><b>qLogNEHVI</b>: ${esc(q.model)} — ${esc(q.candidate_stage)} — ${esc(q.refinement_stage)} — MC ${q.mc_samples}, batch ${pr.budget.qlognehvi_batch_size} × ${pr.budget.qlognehvi_iterations} after ${pr.budget.initial_design} initial points. <span class="muted">${esc(q.why_this_optimiser)}</span></li>
  <li><b>NSGA-III</b>: ${esc(n.variables)}; ${esc(n.reference_directions)}; population ${n.population_size} × ${n.generations} generations; duplicate elimination: ${esc(n.eliminate_duplicates_implementation)}</li>
  <li><b>LHS</b>: ${esc(pr.optimizers.lhs.design)}</li>
  <li>${pr.budget.evaluations_per_run} evaluations per run, seeds ${pr.budget.seeds.join(", ")}, ${pr.budget.total_evaluations} in total. <span class="muted">${esc(pr.budget.sizing)}</span></li></ul>
  <h3>Dense reference</h3><p class="muted">${esc(pr.dense_reference.method)} ${esc(pr.dense_reference.cost_note)} ${esc(pr.dense_reference.parallelism_note)}</p>`;
}
