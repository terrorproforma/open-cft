","mirror_ratios_are_field_descriptors_not_probabilities":true,"shakedown_outcomes_are_not_evidence":true,"usable_as":["cell definitions for the wall-loss geometry screening's launch design (labelled)","cell/cusp descriptors for MDO closures (labelled)","input to the paper's Discussion on the Section 8 nulls (definition scope)"]},"classification":"SCREENING_L1A_FIELD_SEPARATRIX_CUSP_TOPOLOGY","classification_statement":"Magnetic-topology screening of prescribed vacuum field maps under the HEMP/DCFT literature definition of a wall cusp (axis null -> separatrix -> dielectric-wall intersection). The L1a design sets are linear-vacuum equivalent-current screening fields (not P2-qualified, not hardware-valid); the single P2 row is the qualified divergent-exit-stack FEM field. No number here is a plasma, mirror-probability, wall-loss or performance claim; cells and mirror ratios are geometric field descriptors for consumers that carry this label.","definition":{"axis_null":"A point (0, z_k) on the symmetry axis where B_z(0, z) changes sign; B_r == 0 on the axis identically. Detected as a sign change of B_z(0, z) = 2 g(0, z) between consecutive samples (grid nodes plus the window ends) of the C1 axis-regular bicubic interpolant of g = (psi - psi_axis)/r^2 (orbit_mc PsiBicubicField, the accepted orbit v4/screening interpolant), refined by bisection until the bracket width is <= axis_root_bracket_tolerance_m; an exact node zero counts only when the neighbouring nonzero values have opposite signs (a tangency is not a null).","cell":"the wall interval between consecutive cusps (interior), plus [straight_z_min, z_c,1] (anode_partial) and [z_c,K, straight_z_max] (exit_partial); a design without any cusp has one unbounded cell","cusp":"a separatrix-wall intersection with straight_z_min <= z_c <= straight_z_max (the straight cylindrical dielectric; z = straight_z_min is the anode plane for the L1a sets and the start of the regular field domain for the P2 row; z = straight_z_max is chamber.exit_start, the end of the straight dielectric). Intersections outside are recorded with zone anode_side / divergent_exit / downstream_stray_field (the literature's exit cusp when downstream of the last magnet).","held_out_tolerance_m":0.00025,"literature_basis":[{"citation":"Gildea, S. R., Development of the plasma thruster particle-in-cell simulator to complement empirical studies of a low-power cusped-field thruster, Ph.D. thesis, MIT, 2012","key":"gildea2012","locator":"http://hdl.handle.net/1721.1/79338","used_for":"point cusps on the axis where each ring-cusp separatrix intersects the centreline; the field strength goes to zero only there; a separatrix is the surface on which the magnetic vector potential is zero valued"},{"citation":"Kornfeld, G., Koch, N., Harmann, H.-P., Physics and Evolution of HEMP-Thrusters, IEPC-2007-108, 2007","key":"kornfeld2007","locator":"https://electricrocket.org/IEPC/IEPC-2007-108.pdf","used_for":"three magnet rings define four plasma cells separated by three neutral or cusp flux lines"},{"citation":"Koch, N. et al., The HEMPT Concept - A Survey on Theoretical Considerations and Experimental Evidences, IEPC-2011-236, 2011","key":"koch2011","locator":"https://electricrocket.org/IEPC/IEPC-2011-236.pdf","used_for":"PPM stack of axially magnetised rings in opposite magnetisation; cusps at the magnet ends; the exit cusp is formed by the stray field of the last magnet"},{"citation":"Lewerentz, L., Schneider, R., Simplified Optimization of the Magnetic Configuration of HEMP-Thrusters, Applied Sciences 13(6), 3491, 2023","doi":"10.3390/app13063491","key":"lewerentz2023","used_for":"field lines traced from the axis region until they hit the ideal wall r = R; separatrix; mirror ratio B_max/B_0 between the on-axis start point and the wall end point as the configuration descriptor"},{"citation":"Parnell, C. E., Smith, J. M., Neukirch, T., Priest, E. R., The structure of three-dimensional magnetic neutral points, Physics of Plasmas 3, 759-770, 1996","doi":"10.1063/1.871810","key":"parnell1996","used_for":"Jacobian classification of magnetic nulls"},{"citation":"Haynes, A. L., Parnell, C. E., A method for finding three-dimensional magnetic skeletons, Physics of Plasmas 17(9), 092903, 2010","doi":"10.1063/1.3467499","key":"haynes2010","used_for":"separatrix construction by field-line tracing from null eigen-directions"},{"citation":"Murphy, N. A., Parnell, C. E., Haynes, A. L., The appearance, motion, and disappearance of three-dimensional magnetic null points, Physics of Plasmas 22(10), 102117, 2015","doi":"10.1063/1.4934929","key":"murphy2015","used_for":"null counts depend on resolution near degenerate configurations; cross-resolution correspondence"}],"mirror_descriptors":"wall_mirror_ratio = min(|B|(r_w, z_c) over the cell's bounding cusps) / min |B|(r_w, z) over the cell (wall_samples_per_cell + 1 samples); wall_mirror_ratio_strong_end uses the stronger cusp; axis_mirror_ratio = min cusp |B| / max |B_z(0, z)| over the axis interval between the generating nulls (Lewerentz R_m with r_0 -> 0; the literal minimum of |B| on the axis between two nulls is zero at the nulls by definition and is therefore not a descriptor). Partial cells use the neighbouring axis null outside the straight section when one lies in the window, else the section end.","separatrix":"The field line leaving the axis X-null along its radial eigen-direction, seeded at (seed_radius_cell_fraction*dr, z_k) and integrated in the direction that increases r (sign of B_r at the seed) with the event-aware RK4 field-line integrator scheme of coupling v4 (RK4 on the unit field direction with fixed arc-length step trace_step_cell_fraction*min(dr, dz); a wall crossing by any RK stage halves the step, at most wall_event_max_halvings times; the endpoint is snapped to r = r_w when within wall_tolerance_m), sampling the C1 bicubic interpolant. Termination classes: wall (reaches r = r_w), domain_z (leaves the axial extent of the map), null (|B| below null_field_floor_relative * max|B|), step_limit, wall_event_unresolved, degenerate_seed.","stability":"Every design is characterized on its accepted map and on a refined map (L1a sets: the same discrete problem re-solved with 2x radial and axial intervals; P2: the level-2 FEM checkpoint on a 2x regular grid). stable := identical axis-null count in the shared window AND identical number of wall-reaching separatrices AND max |dz_k| <= stability_tolerance_m AND max |dz_c| <= stability_tolerance_m (sorted correspondence).","stability_tolerance_m":0.00025},"design_sets":{"characterization_v1":"the 56 cases of the topology characterization v1 are the held-out reference for the axis-null machinery: v1 already recorded the clustered axis roots with Jacobian classifications on the same geometries (equal-strength alternating stacks of 2-8 stages); v3 must find the same nulls","four_cell_v2":"the sealed candidate set of the preregistered four-cell topology search v2 IS reproducible from its sealed records (sampling identities, source and material hashes equal the dataset for 128/128; the geometry hash equals the dataset once the recorded CRLF-era protocol byte hash is substituted into the geometry evidence note, as disclosed in the v2 POSTHOC_AUDIT), so the literature definition is evaluated on exactly the designs that returned 0/128 under the frozen v2 definition","p2_divergent_exit":"the P2-qualified divergent-exit-stack FEM field (iron poles and return yoke; the field of orbit v4 and of the PIC steady-state runs) tests the definition on a non-L1a field; it is a P2-qualified row, not an L1a screening row","sweep_v2":"the accepted L1a geometry sweep v2 designs, the same 96 fields as the wall-loss geometry screening; re-solved with the screening's identity-proven CPU pipeline (rebuilt case hashes == sealed raw record, QoI replay under the sweep's tolerances, node-wise agreement for the four stored representatives)"},"designs":[{"L_m":0.0114,"axis_bz_peak_t":[0.0939723   <p class="small"><b>Prior disclosures:</b> characterization v1 - ${esc(DATA.prior_campaign_disclosure.characterization_v1)}; four-cell v2 - ${esc(DATA.prior_campaign_disclosure.four_cell_v2)}; sweep v2 - ${esc(DATA.prior_campaign_disclosure.sweep_v2)}; paper - ${esc(DATA.prior_campaign_disclosure.paper)}.</p>`;

  // ------------------------------------------------------------- design table
  const rows = DATA.designs.map((d) => `<tr><td>${esc(d.set)}</td><td>${esc(d.id)}${d.rep ? " *" : ""}</td><td>${d.stages}</td><td>${mm(d.rw_m, 2)}</td><td>${mm(d.L_m, 1)}</td><td>${d.channel_nulls}</td><td><b>${d.cusps}</b></td><td>${d.cells}</td><td>${d.z_c_m.map((z) => mm(z, 2)).join(", ")}</td><td>${d.wall_mirror.filter((v) => v !== null).length ? num(Math.min(...d.wall_mirror.filter((v) => v !== null)), 3) + " - " + num(Math.max(...d.wall_mirror.filter((v) => v !== null)), 3) : "-"}</td><td>${mm(d.max_shift_m, 4)}</td><td>${d.stable ? "yes" : "no"}</td><td>${d.held_out === null ? "n/a" : (d.held_out ? "pass" : "fail")}</td></tr>`).join("");
  $("designs").innerHTML = `<h2>All ${DATA.designs.length} designs (* = representative with sampled separatrix paths)</h2><div class="scroll"><table><thead><tr><th>set</th><th>design</th><th>stages</th><th>r_w (mm)</th><th>L (mm)</th><th>channel nulls</th><th>wall cusps</th><th>cells</th><th>z_c (mm)</th><th>wall mirror range</th><th>max shift (mm)</th><th>stable</th><th>held-out</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  // ------------------------------------------------------------- gates
  const G = DATA.gates;
  $("gates").innerHTML = `<h2>Binding integrity gates (all true) and replay</h2><table><thead><tr><th>gate</th><th>value</th><th>definition</th></tr></thead><tbody>
  ${Object.keys(G.campaign).map((k) => `<tr><td>${esc(k)}</td><td><span class="badge ${G.campaign[k] ? "ok" : "bad"}">${G.campaign[k]}</span></td><td class="small">${esc(G.definitions[k] || "")}</td></tr>`).join("")}
  </tbody></table><p class="small">Reported, not binding: ${G.reported_not_binding.map(esc).join("; ")}. Replays (main-process re-solve + re-characterization vs worker payload): ${G.replays.map((r) => `${esc(r.key)} bit-identical=${r.bit_identical}`).join("; ")}. Execution: ${DATA.execution.worker_pool_size} CPU workers, design stage ${num(DATA.execution.stage_wall_s, 0)} s, assessment ${num(DATA.execution.assessment_wall_s, 0)} s.</p>`;

  // ------------------------------------------------------------- identity
  const I = DATA.identity;
  $("identity").innerHTML = `<h2>Provenance</h2><ul class="tight small">
  <li>experiment <code>${esc(I.experiment_id)}</code>, preregistration commit <code>${esc(I.preregistration_commit_sha)}</code>, command <code>${esc(I.execution_command)}</code></li>
  <li>manifest <code>${esc(I.manifest_file_sha256)}</code> (${I.verified_file_count} files byte-verified of ${I.artifact_count} artifacts); terminal <code>${esc(I.terminal_file_sha256)}</code>; lock <code>${esc(I.lock_file_sha256)}</code></li>
  <li>protocol semantic <code>${esc(I.protocol_semantic_sha256)}</code>; protocol file (LF) <code>${esc(I.protocol_file_sha256_lf)}</code></li>
  <li>experiment code <code>${esc(I.experiment_code_sha256)}</code>; dependency sources <code>${esc(I.dependency_source_sha256)}</code>; field pipeline <code>${esc(I.field_pipeline_source_sha256)}</code></li>
  <li>catalogue <code>${esc(DATA.catalogue.schema_version)}</code>: ${DATA.catalogue.design_count} entries, ${DATA.catalogue.stable_design_count} stable - ${esc(DATA.catalogue.consumer_contract)}</li>
  <li>generator <code>${esc(I.generator_sha256)}</code>; template <code>${esc(I.template_sha256)}</code></li>
  </ul>`;
})();
</script>
</body>
</html>
