      21.6 h, budget 117,000 s (32.5 h); ~2.7 GB device pool.
    module: experiments.pic2d_cft_steady_state_v5.run
    args: [launch, --expect-commit, "351257f299bcd2dc830e9862b39f6f2ae9f40863"]
    gpu: auto
